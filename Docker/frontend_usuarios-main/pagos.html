<!doctype html><html lang="es"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pagos</title>
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/pagos.js" defer></script>
</head><body>
<div class="container">
  <div class="card">
    <h2>Subir comprobante mensual</h2>
    <form id="fm" class="form" enctype="multipart/form-data">
      <label>Periodo</label>
      <input type="month" name="periodo" required>
      <label>Monto (UYU)</label>
      <input type="number" step="0.01" min="0" name="monto" required>
      <label>Comprobante (PDF/JPG/PNG)</label>
      <input type="file" name="archivo" accept=".pdf,.jpg,.jpeg,.png" required>
      <button class="btn">Subir</button>
      <p id="mm" class="msg"></p>
    </form>
  </div>

  <div class="card">
    <h2>Historial</h2>
    <div id="tabla" class="table"></div>
  </div>
</div>
</body></html>
